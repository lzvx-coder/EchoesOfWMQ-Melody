<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万梦琪的个人专辑</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #160f15;
      --ink: #fff7f3;
      --muted: #dbc1bf;
      --dim: #a88b8a;
      --line: rgba(255, 247, 243, 0.16);
      --panel: rgba(255, 247, 243, 0.07);
      --panel-strong: rgba(255, 247, 243, 0.12);
      --accent: #ff9cae;
      --accent-2: #f4c7a1;
      --accent-soft: rgba(255, 156, 174, 0.13);
      --accent-medium: rgba(255, 156, 174, 0.28);
      --accent-border: rgba(255, 156, 174, 0.62);
      --accent-glow: rgba(255, 156, 174, 0.2);
      --shadow: 0 36px 110px rgba(0, 0, 0, 0.48);
    }

    body[data-theme="moon"] {
      --page: #101922;
      --ink: #f6fbff;
      --muted: #c0d2dc;
      --dim: #8ea5b2;
      --line: rgba(246, 251, 255, 0.16);
      --panel: rgba(246, 251, 255, 0.07);
      --panel-strong: rgba(246, 251, 255, 0.12);
      --accent: #7dd3fc;
      --accent-2: #d8b4fe;
      --accent-soft: rgba(125, 211, 252, 0.13);
      --accent-medium: rgba(125, 211, 252, 0.28);
      --accent-border: rgba(125, 211, 252, 0.62);
      --accent-glow: rgba(125, 211, 252, 0.2);
      background:
        linear-gradient(135deg, rgba(125, 211, 252, 0.2), transparent 34%),
        linear-gradient(315deg, rgba(216, 180, 254, 0.16), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(246, 251, 255, 0.08), transparent 35%),
        var(--page);
    }

    body[data-theme="forest"] {
      --page: #121b16;
      --ink: #fbfff9;
      --muted: #c8dcc4;
      --dim: #94a98f;
      --line: rgba(251, 255, 249, 0.16);
      --panel: rgba(251, 255, 249, 0.07);
      --panel-strong: rgba(251, 255, 249, 0.12);
      --accent: #86efac;
      --accent-2: #fde68a;
      --accent-soft: rgba(134, 239, 172, 0.13);
      --accent-medium: rgba(134, 239, 172, 0.28);
      --accent-border: rgba(134, 239, 172, 0.62);
      --accent-glow: rgba(134, 239, 172, 0.2);
      background:
        linear-gradient(135deg, rgba(134, 239, 172, 0.18), transparent 34%),
        linear-gradient(315deg, rgba(253, 230, 138, 0.16), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(251, 255, 249, 0.08), transparent 35%),
        var(--page);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.24), transparent 34%),
        linear-gradient(315deg, rgba(244, 199, 161, 0.18), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(255, 247, 243, 0.08), transparent 35%),
        var(--page);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "♡";
      position: fixed;
      z-index: -1;
      color: rgba(255, 156, 174, 0.14);
      font-size: clamp(120px, 18vw, 260px);
      line-height: 1;
      pointer-events: none;
    }

    body::before {
      top: 5vh;
      left: 4vw;
      transform: rotate(-16deg);
    }

    body::after {
      right: 3vw;
      bottom: 2vh;
      color: rgba(244, 199, 161, 0.12);
      transform: rotate(18deg);
    }

    .ambient-canvas,
    .ambient-texture {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ambient-canvas {
      z-index: 0;
    }

    .ambient-texture {
      z-index: 0;
      opacity: 0.34;
      background-image:
        radial-gradient(circle at 12% 18%, var(--accent-soft) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 28%, var(--accent-soft) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 38% 76%, var(--accent-soft) 0 1px, transparent 2px);
      background-size: 86px 86px, 132px 132px, 174px 174px;
      mix-blend-mode: screen;
    }

    body[data-theme="moon"] .ambient-texture {
      opacity: 0.5;
      background-size: 64px 64px, 108px 108px, 154px 154px;
    }

    body[data-theme="forest"] .ambient-texture {
      opacity: 0.28;
      background-image:
        radial-gradient(ellipse at 20% 30%, var(--accent-soft) 0 2px, transparent 7px),
        radial-gradient(ellipse at 70% 62%, var(--accent-soft) 0 2px, transparent 8px);
      background-size: 120px 180px, 190px 140px;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(1080px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 460px) minmax(0, 1fr);
      gap: clamp(26px, 5vw, 64px);
      align-items: center;
      padding: clamp(14px, 2vw, 22px);
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 247, 243, 0.075), rgba(255, 247, 243, 0.025));
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .cover-column {
      display: grid;
      gap: 18px;
    }

    .cover-wrap {
      position: relative;
      isolation: isolate;
      cursor: pointer;
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: 8% -7% -8% 10%;
      z-index: -1;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.42), rgba(244, 199, 161, 0.28));
      filter: blur(50px);
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    .cover-halo {
      position: absolute;
      inset: -8px;
      z-index: -1;
      border-radius: 14px;
      opacity: 0.22;
      background: conic-gradient(from 0deg, var(--accent), transparent 24%, var(--accent-2), transparent 72%, var(--accent));
      filter: blur(10px);
      transition: opacity 360ms ease, filter 360ms ease;
      pointer-events: none;
    }

    .cover-wrap.is-spinning .cover-halo {
      opacity: 0.9;
      filter: blur(7px);
      animation: halo-spin 5.6s linear infinite;
    }

    @keyframes halo-spin {
      to { transform: rotate(360deg); }
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 8px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      object-fit: cover;
      box-shadow: var(--shadow);
      transform: rotate(0deg);
      transform-origin: center;
      transition: transform 220ms ease, filter 220ms ease, border-radius 380ms ease, box-shadow 380ms ease;
    }

    .cover-wrap:hover .cover,
    .cover-wrap:focus-within .cover {
      transform: translateY(-2px);
      filter: saturate(1.06) brightness(1.04);
    }

    .cover-wrap.is-secret .cover {
      animation: secret-cover 780ms ease both;
    }

    .record-lines {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle, transparent 0 17%, rgba(0, 0, 0, 0.2) 18% 100%),
        repeating-radial-gradient(circle, rgba(255, 247, 243, 0.2) 0 1px, transparent 1px 11px);
      mix-blend-mode: soft-light;
      transition: opacity 360ms ease;
      pointer-events: none;
    }

    .dedication {
      margin: 0;
      padding-left: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .album {
      min-width: 0;
      display: grid;
      gap: 24px;
      padding: clamp(0px, 2vw, 12px) 0;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .heart {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(232, 155, 134, 0.44);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 28px var(--accent-glow);
      font-size: 14px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 7em;
      font-size: clamp(44px, 7.4vw, 84px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 18px 60px rgba(255, 156, 174, 0.16);
    }

    .summary {
      max-width: 520px;
      margin: -8px 0 4px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .tracks {
      display: grid;
      gap: 10px;
      margin: 0;
      max-height: calc((70px * 4) + (10px * 3));
      padding: 0 6px 0 0;
      list-style: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--accent-border) rgba(255, 247, 243, 0.08);
      scrollbar-width: thin;
    }

    .tracks::-webkit-scrollbar {
      width: 8px;
    }

    .tracks::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(255, 247, 243, 0.08);
    }

    .tracks::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    .tracks button {
      --track-progress: 0%;
      width: 100%;
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 38px 1fr 40px;
      align-items: center;
      gap: 16px;
      font: inherit;
      text-align: left;
      color: var(--ink);
      background:
        linear-gradient(90deg, var(--accent-soft) 0 var(--track-progress), transparent var(--track-progress) 100%),
        linear-gradient(135deg, rgba(255, 247, 243, 0.088), rgba(255, 247, 243, 0.045));
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .tracks button:hover,
    .tracks button:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent-border);
      background:
        linear-gradient(135deg, var(--accent-soft), rgba(255, 247, 243, 0.07));
      box-shadow: 0 18px 44px var(--accent-glow);
    }

    .tracks button[aria-current="true"] {
      border-color: var(--accent-border);
      background:
        linear-gradient(90deg, var(--accent-medium) 0 var(--track-progress), transparent var(--track-progress) 100%),
        linear-gradient(135deg, var(--accent-soft), rgba(255, 247, 243, 0.07));
    }

    .track-number {
      color: var(--dim);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .track-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .track-state {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.08);
      font-size: 13px;
      justify-self: end;
    }

    .tracks button[aria-current="true"] .track-state {
      border-color: transparent;
      color: #2a1016;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px var(--accent-medium);
    }

    .album-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button,
    .theme-select,
    .comment-form button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .action-button:hover,
    .action-button:focus-visible,
    .theme-select:hover,
    .theme-select:focus-visible,
    .comment-form button:hover,
    .comment-form button:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent-border);
      background: var(--panel-strong);
    }

    .action-button[aria-pressed="true"] {
      border-color: rgba(255, 156, 174, 0.76);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.2), rgba(244, 199, 161, 0.1));
    }

    .theme-select {
      width: 100%;
      appearance: none;
      text-align: center;
      color-scheme: dark;
    }

    .theme-select option {
      color: var(--ink);
      background: var(--page);
    }

    .player {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.11), rgba(255, 247, 243, 0.04));
      box-shadow: inset 0 1px 0 rgba(255, 247, 243, 0.08);
    }

    .spectrum {
      width: 100%;
      height: 58px;
      display: block;
      border-radius: 8px;
      background: linear-gradient(180deg, transparent, var(--accent-soft));
    }

    .player-copy.is-changing {
      animation: player-copy-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes player-copy-in {
      from { opacity: 0; transform: translateY(9px); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    audio {
      width: 100%;
      height: 42px;
      filter: saturate(0.86);
    }

    .now-playing {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .track-note {
      min-height: 24px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.055);
      font-size: 14px;
      line-height: 1.6;
    }

    .comments {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 247, 243, 0.045);
    }

    .comments h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .comment-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .comment-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.06);
      outline: none;
    }

    .comment-input:focus {
      border-color: var(--accent-border);
      background: rgba(255, 247, 243, 0.08);
    }

    .comment-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .comment-list li {
      padding: 10px 12px;
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 247, 243, 0.045);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      animation: comment-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .comment-list li.is-removing {
      animation: comment-out 240ms ease forwards;
    }

    @keyframes comment-in {
      from { opacity: 0; transform: translateY(12px) rotate(-0.4deg); background: var(--accent-soft); }
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @keyframes comment-out {
      to { opacity: 0; transform: translateX(20px) scale(0.97); }
    }

    .like-particle {
      position: fixed;
      z-index: 30;
      color: var(--accent);
      font-size: 13px;
      line-height: 1;
      pointer-events: none;
      animation: like-burst 620ms ease-out forwards;
    }

    @keyframes like-burst {
      from { opacity: 1; transform: translate(-50%, -50%) scale(0.65); }
      to { opacity: 0; transform: translate(calc(-50% + var(--particle-x)), calc(-50% + var(--particle-y))) scale(1.25) rotate(var(--particle-r)); }
    }

    .comment-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
    }

    .comment-delete,
    .clear-comments {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px;
      color: var(--muted);
      background: var(--panel);
      cursor: pointer;
    }

    .clear-comments {
      justify-self: end;
    }

    .clear-comments[hidden] {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    :where(button, select, input, [role="button"]):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .cover-wrap.is-spinning .cover {
      border-radius: 50%;
      filter: saturate(1.08) brightness(1.04);
      box-shadow:
        var(--shadow),
        0 0 34px rgba(255, 156, 174, 0.28),
        0 0 78px rgba(244, 199, 161, 0.16);
    }

    .cover-wrap.is-spinning::after {
      inset: 45%;
      border-radius: 50%;
      background: rgba(22, 15, 21, 0.78);
      box-shadow:
        0 0 0 12px rgba(255, 247, 243, 0.1),
        0 0 0 26px rgba(0, 0, 0, 0.16);
    }

    .cover-wrap.is-spinning::before {
      animation: album-pulse 1800ms ease-in-out infinite;
    }

    .cover-wrap.is-spinning .record-lines,
    .cover-wrap.is-returning .record-lines {
      opacity: 0.58;
    }

    .cover-wrap.is-returning .cover {
      border-radius: 50%;
    }

    @keyframes album-pulse {
      0%,
      100% {
        opacity: 0.84;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.045);
      }
    }

    .secret-note {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 36px));
      transform: translateX(-50%);
      border: 1px solid rgba(255, 247, 243, 0.18);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.94), rgba(244, 199, 161, 0.9));
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.36);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      animation: secret-note 2600ms ease both;
      pointer-events: none;
    }

    .secret-heart {
      position: fixed;
      z-index: 19;
      width: 14px;
      height: 14px;
      color: var(--accent);
      font-size: 14px;
      line-height: 1;
      text-shadow: 0 0 18px rgba(255, 156, 174, 0.42);
      animation: secret-heart 1200ms ease-out forwards;
      pointer-events: none;
    }

    @keyframes secret-cover {
      0%,
      100% {
        transform: scale(1);
      }

      38% {
        transform: scale(1.035) rotate(-1.2deg);
      }

      68% {
        transform: scale(1.018) rotate(1deg);
      }
    }

    @keyframes secret-note {
      0% {
        opacity: 0;
        transform: translate(-50%, 18px);
      }

      14%,
      82% {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 14px);
      }
    }

    @keyframes secret-heart {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--secret-x)), calc(-50% - var(--secret-y))) scale(1.45) rotate(var(--secret-r));
      }
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
        align-items: start;
      }

      main {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .cover-column {
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        max-width: none;
        font-size: clamp(38px, 12vw, 62px);
      }

      .tracks button {
        min-height: 64px;
      }

      .tracks {
        max-height: calc((64px * 4) + (10px * 3));
      }

      .album-actions,
      .comment-form {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      main {
        padding: 12px;
      }

      .album {
        gap: 18px;
      }

      .tracks button {
        grid-template-columns: 30px minmax(0, 1fr) 36px;
        gap: 10px;
        padding-inline: 12px;
      }

      .track-title {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .ambient-canvas,
      .spectrum {
        opacity: 0.45;
      }
    }
  </style>
</head>
<body>
  <canvas class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="ambient-texture" aria-hidden="true"></div>
  <main>
    <div class="cover-column">
      <div class="cover-wrap" role="button" tabindex="0" aria-label="专辑封面，连续激活三次可查看彩蛋">
        <span class="cover-halo" aria-hidden="true"></span>
        <img class="cover" src="album-cover.png?v=20261118-2" alt="万梦琪的个人专辑封面">
        <span class="record-lines" aria-hidden="true"></span>
      </div>
      <p class="dedication">把一小束光留给你</p>
    </div>

    <section class="album" aria-label="专辑播放器">
      <div class="meta-line">
        <span class="heart" aria-hidden="true">♡</span>
        <span>Personal Album</span>
      </div>

      <h1>万梦琪的个人专辑</h1>
      <p class="summary">听见她的声音</p>

      <ul class="tracks" aria-label="歌曲列表"></ul>

      <div class="album-actions" aria-label="专辑操作">
        <button class="action-button" type="button" id="likeButton" aria-pressed="false">
          <span aria-hidden="true">♥</span>
          <span id="likeText">收藏专辑</span>
        </button>
        <button class="action-button" type="button" id="shuffleButton">
          <span aria-hidden="true">↝</span>
          <span>随机播放</span>
        </button>
        <select class="theme-select" id="themeSelect" aria-label="主题切换">
          <option value="rose">绯红</option>
          <option value="moon">静谧夜</option>
          <option value="forest">苍翠</option>
        </select>
      </div>
      
      <div class="player">
        <canvas class="spectrum" width="640" height="116" aria-hidden="true"></canvas>
        <audio controls preload="metadata"></audio>
        <div class="player-copy">
          <p class="now-playing" aria-live="polite">点击一首歌开始播放</p>
          <p class="track-note" aria-live="polite">选一首歌吧</p>
        </div>
      </div>

      <section class="comments" aria-label="本地留言墙">
        <h2>留言墙</h2>
        <form class="comment-form">
          <label class="sr-only" for="commentInput">留言内容</label>
          <input class="comment-input" id="commentInput" name="comment" type="text" maxlength="80" autocomplete="off" placeholder="说点什么吧">
          <button type="submit">就这样</button>
        </form>
        <button class="clear-comments" type="button" hidden>清空留言</button>
        <ul class="comment-list" aria-live="polite"></ul>
      </section>
    </section>
  </main>

  <script>
    // 曲目只在这里维护；序号和按钮结构由页面自动生成。
    const tracks = [
      ["trust me.mp3", "trust me", "试试看我的爱"], ["怎样.mp3", "怎样", "我这里天黑了，我想你了"],
      ["难过233秒.mp3", "难过233秒", "最后一秒不要难过，要开心哦"], ["恋爱困难少女.mp3", "恋爱困难少女", "社恐才是恋爱困难少女"],
      ["世界正中.mp3", "世界正中", "世界很大，但这一刻的正中间是你"], ["这世界也是我的家.mp3", "这世界也是我的家", "你听不见我说话"],
      ["巴拉莱卡.mp3", "巴拉莱卡", "我用尽了一生赞美，他教导有方"], ["完美先生和差不多小姐.mp3", "完美先生和差不多小姐", "我奔向你，记得牵我的手"],
      ["偶尔.mp3", "偶尔", "我来到，记忆里的长廊"], ["失落沙洲.mp3", "失落沙洲", "只是越看见海阔天空，越遗憾没有你分享我的感动"],
      ["春夜坠落.mp3", "春夜坠落", "在遇见你之前我从没感觉如此心动"], ["病变.mp3", "病变", "可能猫也爱过你"],
      ["第57次取消发送.mp3", "第57次取消发送", "我好想你"], ["花园.mp3", "花园", "原来爱只适合做花园"],
      ["过江寒.mp3", "过江寒", "岸上还有岸"], ["阴天.mp3", "阴天", "回想那一天，喧闹的喜宴"],
      ["飞鸟和蝉.mp3", "飞鸟和蝉", "相遇一定有意义"], ["惧高症.mp3", "惧高症", "我惧高，我爱你"],
      ["我的名字.mp3", "我的名字", "拜托你轻声重着我的名字"], ["唯一.mp3", "唯一", "选择喜欢你的人"],
      ["夜奔.mp3", "夜奔", "那雪越下的猛"], ["青花瓷.mp3", "青花瓷", "天青色等烟雨"],
      ["她的花.mp3", "她的花", "她的花依然在开"], ["pinKing.mp3", "pinKing", "粉色是藏不住的热烈"],
      ["后会友期.mp3", "后会友期", "告别不是终点"], ["在恒星里逃离.mp3", "在恒星里逃离", "推理物理星系，让我走进你心里"],
      ["夜蝶.mp3", "夜蝶", "这首歌在我心里只能排第二"], ["胆小鬼.mp3", "胆小鬼", "你在你的世界无所谓，我在我的世界不敢犯规"],
      ["草地漫步.mp3", "草地漫步", "只想慢慢靠近，就像傍晚踩过草地"]
    ];

    const trackList = document.querySelector(".tracks");
    const trackFragment = document.createDocumentFragment();
    tracks.forEach(([src, title, note], index) => {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.src = src;
      button.dataset.title = title;
      button.dataset.note = note;
      button.setAttribute("aria-current", "false");
      button.innerHTML = `<span class="track-number">${String(index + 1).padStart(2, "0")}</span><span class="track-title"></span><span class="track-state" aria-hidden="true">▶</span>`;
      button.querySelector(".track-title").textContent = title;
      item.append(button);
      trackFragment.append(item);
    });
    trackList.append(trackFragment);

    const audio = document.querySelector("audio");
    const statusText = document.querySelector(".now-playing");
    const playerCopy = document.querySelector(".player-copy");
    const spectrumCanvas = document.querySelector(".spectrum");
    const spectrumContext = spectrumCanvas.getContext("2d");
    const ambientCanvas = document.querySelector(".ambient-canvas");
    const ambientContext = ambientCanvas.getContext("2d");
    const coverWrap = document.querySelector(".cover-wrap");
    const coverImage = document.querySelector(".cover");
    const trackButtons = Array.from(document.querySelectorAll("[data-src]"));
    let coverTapCount = 0;
    let coverTapTimer;
    let vinylAnimation;
    let returnTimer;
    let audioContext;
    let analyser;
    let frequencyData;

    function animatePlayerCopy() {
      playerCopy.classList.remove("is-changing");
      void playerCopy.offsetWidth;
      playerCopy.classList.add("is-changing");
    }

    function initializeAudioAnalyser() {
      if (analyser) {
        if (audioContext.state === "suspended") audioContext.resume();
        return;
      }
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.82;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
      } catch (error) {
        analyser = null;
      }
    }

    function setActiveTrack(activeButton) {
      trackButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.setAttribute("aria-current", String(isActive));
        button.querySelector(".track-state").textContent = isActive ? "❚❚" : "▶";
        if (!isActive) button.style.setProperty("--track-progress", "0%");
      });
      if (activeButton) {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        activeButton.scrollIntoView({ block: "nearest", behavior: reducedMotion ? "auto" : "smooth" });
      }
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const shouldLoad = audio.getAttribute("src") !== button.dataset.src;

        if (shouldLoad) {
          audio.src = button.dataset.src;
          statusText.textContent = `正在播放：${button.dataset.title}`;
          setActiveTrack(button);
          animatePlayerCopy();
        }

        if (!audio.paused && !shouldLoad) {
          audio.pause();
          button.querySelector(".track-state").textContent = "▶";
          statusText.textContent = `已暂停：${button.dataset.title}`;
          return;
        }

        try {
          await audio.play();
          initializeAudioAnalyser();
          setActiveTrack(button);
          statusText.textContent = `正在播放：${button.dataset.title}`;
        } catch (error) {
          statusText.textContent = "浏览器阻止了播放，请再点一次播放按钮";
        }
      });
    });

    audio.addEventListener("ended", () => {
      const currentIndex = getActiveTrackIndex();
      const nextButton = trackButtons[currentIndex + 1];

      if (nextButton) {
        nextButton.click();
      } else {
        setActiveTrack(null);
        statusText.textContent = "播放结束";
      }
    });

    function showSecretNote() {
      const oldNote = document.querySelector(".secret-note");

      if (oldNote) {
        oldNote.remove();
      }

      const note = document.createElement("div");
      note.className = "secret-note";
      note.textContent = "这张专辑偷偷多放了一点喜欢。";
      document.body.append(note);
      setTimeout(() => note.remove(), 2600);
    }

    function burstSecretHearts() {
      const coverBox = coverWrap.getBoundingClientRect();
      const originX = coverBox.left + coverBox.width / 2;
      const originY = coverBox.top + coverBox.height / 2;

      for (let index = 0; index < 14; index += 1) {
        const heart = document.createElement("span");
        const angle = (Math.PI * 2 * index) / 14;
        const distance = 76 + Math.random() * 68;

        heart.className = "secret-heart";
        heart.textContent = "\u2665";
        heart.style.left = `${originX}px`;
        heart.style.top = `${originY}px`;
        heart.style.setProperty("--secret-x", `${Math.cos(angle) * distance}px`);
        heart.style.setProperty("--secret-y", `${Math.sin(angle) * distance + 80}px`);
        heart.style.setProperty("--secret-r", `${Math.random() * 80 - 40}deg`);
        document.body.append(heart);
        setTimeout(() => heart.remove(), 1200);
      }
    }

    function unlockCoverSecret() {
      coverWrap.classList.remove("is-secret");
      void coverWrap.offsetWidth;
      coverWrap.classList.add("is-secret");
      statusText.textContent = "这张专辑偷偷多放了一点喜欢。";
      showSecretNote();
      burstSecretHearts();
      setTimeout(() => coverWrap.classList.remove("is-secret"), 780);
    }

    function countCoverTap() {
      coverTapCount += 1;
      clearTimeout(coverTapTimer);
      coverTapTimer = setTimeout(() => {
        coverTapCount = 0;
      }, 1400);

      if (coverTapCount >= 3) {
        coverTapCount = 0;
        unlockCoverSecret();
      }
    }

    coverWrap.addEventListener("click", countCoverTap);
    coverWrap.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        countCoverTap();
      }
    });

    const noteText = document.querySelector(".track-note");
    const likeButton = document.querySelector("#likeButton");
    const likeText = document.querySelector("#likeText");
    const shuffleButton = document.querySelector("#shuffleButton");
    const themeSelect = document.querySelector("#themeSelect");
    const commentForm = document.querySelector(".comment-form");
    const commentInput = document.querySelector(".comment-input");
    const commentList = document.querySelector(".comment-list");
    const clearCommentsButton = document.querySelector(".clear-comments");
    const storageKeys = {
      liked: "wmq-album-liked",
      theme: "wmq-album-theme",
      comments: "wmq-album-comments"
    };
    const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let visualAccent = "#ff9cae";
    let visualAccent2 = "#f4c7a1";
    const stars = Array.from({ length: 42 }, () => ({
      x: Math.random(),
      y: Math.random(),
      radius: 0.6 + Math.random() * 1.8,
      speed: 0.00004 + Math.random() * 0.0001,
      phase: Math.random() * Math.PI * 2
    }));

    function resizeCanvas(canvas, context) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      return rect;
    }

    function drawSpectrum(time) {
      const rect = resizeCanvas(spectrumCanvas, spectrumContext);
      spectrumContext.clearRect(0, 0, rect.width, rect.height);
      const bars = 24;
      const gap = 4;
      const width = (rect.width - gap * (bars - 1)) / bars;
      const playing = !audio.paused && !audio.ended;
      if (analyser && frequencyData) analyser.getByteFrequencyData(frequencyData);
      const gradient = spectrumContext.createLinearGradient(0, rect.height, 0, 0);
      gradient.addColorStop(0, visualAccent);
      gradient.addColorStop(1, visualAccent2);
      spectrumContext.fillStyle = gradient;
      for (let index = 0; index < bars; index += 1) {
        const realLevel = analyser && frequencyData
          ? frequencyData[Math.min(frequencyData.length - 1, index * 2)] / 255
          : 0;
        const breath = (Math.sin(time * 0.003 + index * 0.72) + 1) * 0.08;
        const level = playing ? Math.max(0.08, realLevel, breath) : 0.06 + breath * 0.2;
        const height = Math.max(3, level * rect.height * 0.9);
        spectrumContext.globalAlpha = playing ? 0.88 : 0.34;
        spectrumContext.beginPath();
        spectrumContext.roundRect(index * (width + gap), rect.height - height, width, height, Math.min(4, width / 2));
        spectrumContext.fill();
      }
      spectrumContext.globalAlpha = 1;
    }

    function drawAmbient(time) {
      const rect = resizeCanvas(ambientCanvas, ambientContext);
      ambientContext.clearRect(0, 0, rect.width, rect.height);
      const moving = !audio.paused && !reducedMotionQuery.matches;
      stars.forEach((star) => {
        if (moving) star.y = (star.y - star.speed * 16 + 1) % 1;
        const pulse = 0.25 + (Math.sin(time * 0.0015 + star.phase) + 1) * 0.2;
        ambientContext.globalAlpha = pulse;
        ambientContext.fillStyle = visualAccent;
        ambientContext.beginPath();
        ambientContext.arc(star.x * rect.width, star.y * rect.height, star.radius, 0, Math.PI * 2);
        ambientContext.fill();
      });
      ambientContext.globalAlpha = 1;
    }

    function renderVisuals(time) {
      drawSpectrum(time);
      drawAmbient(time);
      requestAnimationFrame(renderVisuals);
    }
    requestAnimationFrame(renderVisuals);

    function getActiveTrackIndex() {
      return trackButtons.findIndex((button) => button.getAttribute("aria-current") === "true");
    }

    function updateTrackNote(button) {
      noteText.textContent = button.dataset.note || "选一首歌吧";
      animatePlayerCopy();
    }

    function getCurrentCoverRotation() {
      const transform = getComputedStyle(coverImage).transform;

      if (!transform || transform === "none") {
        return 0;
      }

      const values = transform.match(/matrix\(([^)]+)\)/);

      if (!values) {
        return 0;
      }

      const [a, b] = values[1].split(",").map(Number);
      const angle = Math.atan2(b, a) * (180 / Math.PI);
      return angle < 0 ? angle + 360 : angle;
    }

    function startCoverSpin() {
      if (vinylAnimation || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const currentRotation = getCurrentCoverRotation();
      clearTimeout(returnTimer);
      coverWrap.classList.remove("is-returning");
      coverImage.style.transition = "";
      coverImage.style.transform = "";
      vinylAnimation = coverImage.animate([
        { transform: `rotate(${currentRotation}deg)` },
        { transform: `rotate(${currentRotation + 360}deg)` }
      ], {
        duration: 5600,
        easing: "linear",
        iterations: Infinity
      });
    }

    function returnCoverHome() {
      if (!vinylAnimation) {
        coverWrap.classList.remove("is-returning");
        coverImage.style.transform = "";
        return;
      }

      const currentRotation = getCurrentCoverRotation();
      const remainingRotation = currentRotation < 0.5 ? 0 : 360 - currentRotation;
      const returnDuration = remainingRotation === 0 ? 0 : Math.max(420, Math.round((remainingRotation / 360) * 1100));
      const targetRotation = remainingRotation === 0 ? 0 : 360;
      vinylAnimation.cancel();
      vinylAnimation = null;
      coverWrap.classList.add("is-returning");
      coverImage.style.transition = "none";
      coverImage.style.transform = `rotate(${currentRotation}deg)`;
      void coverImage.offsetWidth;
      coverImage.style.transition = returnDuration
        ? `transform ${returnDuration}ms cubic-bezier(0.22, 1, 0.36, 1), border-radius 380ms ease, box-shadow 380ms ease, filter 300ms ease`
        : "none";
      coverImage.style.transform = `rotate(${targetRotation}deg)`;

      returnTimer = setTimeout(() => {
        if (!vinylAnimation) {
          coverWrap.classList.remove("is-returning");
          coverImage.style.transition = "none";
          coverImage.style.transform = "";
          void coverImage.offsetWidth;
          coverImage.style.transition = "";
        }
      }, returnDuration + 40);
    }

    function updateCoverSpin() {
      const shouldSpin = Boolean(audio.getAttribute("src")) && !audio.paused && !audio.ended;
      coverWrap.classList.toggle("is-spinning", shouldSpin);

      if (shouldSpin) {
        startCoverSpin();
      } else {
        returnCoverHome();
      }
    }

    function updatePausedTrackIcon() {
      const activeIndex = getActiveTrackIndex();

      if (activeIndex >= 0 && audio.paused) {
        trackButtons[activeIndex].querySelector(".track-state").textContent = "▶";
      }
    }

    function updatePlayingTrackIcon() {
      const activeIndex = getActiveTrackIndex();

      if (activeIndex >= 0 && !audio.paused) {
        trackButtons[activeIndex].querySelector(".track-state").textContent = "❚❚";
      }
    }

    function setLiked(isLiked) {
      localStorage.setItem(storageKeys.liked, String(isLiked));
      likeButton.setAttribute("aria-pressed", String(isLiked));
      likeText.textContent = isLiked ? "已收藏" : "收藏专辑";
    }

    function burstLikeParticles() {
      if (reducedMotionQuery.matches) return;
      const box = likeButton.getBoundingClientRect();
      for (let index = 0; index < 7; index += 1) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * index) / 7 - Math.PI / 2;
        const distance = 28 + Math.random() * 22;
        particle.className = "like-particle";
        particle.textContent = "♥";
        particle.style.left = `${box.left + box.width / 2}px`;
        particle.style.top = `${box.top + box.height / 2}px`;
        particle.style.setProperty("--particle-x", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--particle-y", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--particle-r", `${Math.random() * 60 - 30}deg`);
        document.body.append(particle);
        setTimeout(() => particle.remove(), 650);
      }
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      themeSelect.value = theme;
      localStorage.setItem(storageKeys.theme, theme);
      const styles = getComputedStyle(document.body);
      visualAccent = styles.getPropertyValue("--accent").trim();
      visualAccent2 = styles.getPropertyValue("--accent-2").trim();
    }

    function readComments() {
      try {
        return JSON.parse(localStorage.getItem(storageKeys.comments)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveComments(comments) {
      localStorage.setItem(storageKeys.comments, JSON.stringify(comments));
    }

    function renderComments() {
      const comments = readComments();
      commentList.innerHTML = "";

      if (comments.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.textContent = "这里还没有留言哦";
        commentList.append(emptyItem);
        clearCommentsButton.hidden = true;
        return;
      }

      clearCommentsButton.hidden = false;
      comments.forEach((comment, index) => {
        const item = document.createElement("li");
        item.className = "comment-item";
        const text = document.createElement("span");
        text.textContent = comment;
        const deleteButton = document.createElement("button");
        deleteButton.className = "comment-delete";
        deleteButton.type = "button";
        deleteButton.dataset.commentIndex = String(index);
        deleteButton.setAttribute("aria-label", `删除留言：${comment}`);
        deleteButton.textContent = "删除";
        item.append(text, deleteButton);
        commentList.append(item);
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", () => {
        updateTrackNote(button);
        setTimeout(updateCoverSpin, 0);
      });
    });

    audio.addEventListener("play", () => {
      updateCoverSpin();
      updatePlayingTrackIcon();
    });
    audio.addEventListener("pause", () => {
      updateCoverSpin();
      updatePausedTrackIcon();
    });
    audio.addEventListener("ended", updateCoverSpin);
    audio.addEventListener("timeupdate", () => {
      const activeIndex = getActiveTrackIndex();
      if (activeIndex < 0 || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
      const progress = Math.min(100, Math.max(0, (audio.currentTime / audio.duration) * 100));
      trackButtons[activeIndex].style.setProperty("--track-progress", `${progress}%`);
    });
    audio.addEventListener("error", () => {
      const activeIndex = getActiveTrackIndex();
      const title = activeIndex >= 0 ? trackButtons[activeIndex].dataset.title : "当前歌曲";
      setActiveTrack(null);
      updateCoverSpin();
      statusText.textContent = `无法加载《${title}》，请检查音频文件是否存在。`;
    });

    likeButton.addEventListener("click", () => {
      const nextLiked = likeButton.getAttribute("aria-pressed") !== "true";
      setLiked(nextLiked);
      statusText.textContent = nextLiked ? "已收藏这张专辑。" : "已取消收藏。";
      if (nextLiked) burstLikeParticles();
    });

    shuffleButton.addEventListener("click", () => {
      const currentIndex = getActiveTrackIndex();
      let nextIndex = Math.floor(Math.random() * trackButtons.length);

      if (trackButtons.length > 1) {
        while (nextIndex === currentIndex) {
          nextIndex = Math.floor(Math.random() * trackButtons.length);
        }
      }

      trackButtons[nextIndex].click();
    });

    themeSelect.addEventListener("change", () => {
      setTheme(themeSelect.value);
    });

    commentForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = commentInput.value.trim();

      if (!value) {
        return;
      }

      const comments = readComments();
      comments.unshift(value);
      saveComments(comments.slice(0, 12));
      commentInput.value = "";
      renderComments();
    });

    commentList.addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".comment-delete");
      if (!deleteButton) return;
      const item = deleteButton.closest("li");
      const removeComment = () => {
        const comments = readComments();
        comments.splice(Number(deleteButton.dataset.commentIndex), 1);
        saveComments(comments);
        renderComments();
        statusText.textContent = "留言已删除。";
      };
      if (reducedMotionQuery.matches) {
        removeComment();
      } else {
        item.classList.add("is-removing");
        item.addEventListener("animationend", removeComment, { once: true });
      }
    });

    clearCommentsButton.addEventListener("click", () => {
      if (!window.confirm("确定清空全部本地留言吗？")) return;
      saveComments([]);
      renderComments();
      statusText.textContent = "留言已清空。";
    });

    setLiked(localStorage.getItem(storageKeys.liked) === "true");
    setTheme(localStorage.getItem(storageKeys.theme) || "rose");
    renderComments();
  </script>
</body>
</html>
