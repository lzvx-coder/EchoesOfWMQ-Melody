<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XXX 的个人专辑</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1eb;
      --ink: #1f2428;
      --muted: #6c737a;
      --line: #d8d1c6;
      --panel: #fffdfa;
      --panel-soft: #f8f5ef;
      --accent: #1f7a72;
      --accent-dark: #145852;
      --shadow: 0 24px 70px rgba(31, 36, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(31, 36, 40, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(31, 36, 40, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 36px 36px;
    }

    main {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: 260px 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .cover {
      min-height: 420px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(145deg, rgba(31, 122, 114, 0.95), rgba(31, 36, 40, 0.96)),
        linear-gradient(45deg, transparent 35%, rgba(255, 255, 255, 0.14) 35% 42%, transparent 42%);
      color: #fff;
    }

    .album-mark {
      width: 72px;
      height: 72px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
    }

    .cover-meta {
      display: grid;
      gap: 10px;
    }

    .label {
      margin: 0;
      color: rgba(255, 255, 255, 0.66);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
    }

    .content {
      padding: clamp(26px, 5vw, 42px);
      display: grid;
      align-content: center;
      gap: 26px;
    }

    .section-title {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tracks {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    button {
      width: 100%;
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 42px 1fr 36px;
      align-items: center;
      gap: 14px;
      font: inherit;
      text-align: left;
      color: var(--ink);
      background: var(--panel-soft);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(31, 122, 114, 0.55);
      background: #fff;
      box-shadow: 0 12px 26px rgba(31, 36, 40, 0.08);
      outline: none;
    }

    button[aria-pressed="true"] {
      border-color: rgba(31, 122, 114, 0.7);
      background: rgba(31, 122, 114, 0.08);
    }

    .track-number {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .track-title {
      min-width: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .track-state {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      font-size: 13px;
      justify-self: end;
    }

    button[aria-pressed="true"] .track-state {
      background: var(--accent);
    }

    .player {
      display: grid;
      gap: 12px;
      padding-top: 4px;
    }

    audio {
      width: 100%;
      height: 42px;
    }

    .now-playing {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .cover {
        min-height: 230px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="cover" aria-label="专辑信息">
      <div class="album-mark">A</div>
      <div class="cover-meta">
        <p class="label">Personal Album</p>
        <h1>XXX 的个人专辑</h1>
      </div>
    </section>

    <section class="content">
      <p class="section-title">Songs</p>

      <ul class="tracks" aria-label="歌曲列表">
        <li>
          <button type="button" data-src="trust me.mp3" data-title="trust me" aria-pressed="false">
            <span class="track-number">01</span>
            <span class="track-title">trust me</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="怎样.mp3" data-title="怎样" aria-pressed="false">
            <span class="track-number">02</span>
            <span class="track-title">怎样</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="难过233秒.mp3" data-title="难过233秒" aria-pressed="false">
            <span class="track-number">03</span>
            <span class="track-title">难过233秒</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
      </ul>

      <div class="player">
        <audio controls preload="metadata"></audio>
        <p class="now-playing" aria-live="polite">点击一首歌开始播放</p>
      </div>
    </section>
  </main>

  <script>
    const audio = document.querySelector("audio");
    const statusText = document.querySelector(".now-playing");
    const trackButtons = Array.from(document.querySelectorAll("[data-src]"));

    function setActiveTrack(activeButton) {
      trackButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.setAttribute("aria-pressed", String(isActive));
        button.querySelector(".track-state").textContent = isActive ? "❚❚" : "▶";
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const shouldLoad = audio.getAttribute("src") !== button.dataset.src;

        if (shouldLoad) {
          audio.src = button.dataset.src;
          statusText.textContent = `正在播放：${button.dataset.title}`;
          setActiveTrack(button);
        }

        if (!audio.paused && !shouldLoad) {
          audio.pause();
          button.querySelector(".track-state").textContent = "▶";
          statusText.textContent = `已暂停：${button.dataset.title}`;
          return;
        }

        try {
          await audio.play();
          setActiveTrack(button);
          statusText.textContent = `正在播放：${button.dataset.title}`;
        } catch (error) {
          statusText.textContent = "浏览器阻止了播放，请再点一次播放按钮";
        }
      });
    });

    audio.addEventListener("ended", () => {
      const currentIndex = trackButtons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
      const nextButton = trackButtons[currentIndex + 1];

      if (nextButton) {
        nextButton.click();
      } else {
        setActiveTrack(null);
        statusText.textContent = "播放结束";
      }
    });
  </script>
</body>
</html>
