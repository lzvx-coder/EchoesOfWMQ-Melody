<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万梦琪的个人专辑</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #160f15;
      --ink: #fff7f3;
      --muted: #dbc1bf;
      --dim: #a88b8a;
      --line: rgba(255, 247, 243, 0.16);
      --panel: rgba(255, 247, 243, 0.07);
      --panel-strong: rgba(255, 247, 243, 0.12);
      --accent: #ff9cae;
      --accent-2: #f4c7a1;
      --shadow: 0 36px 110px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.24), transparent 34%),
        linear-gradient(315deg, rgba(244, 199, 161, 0.18), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(255, 247, 243, 0.08), transparent 35%),
        var(--page);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "♡";
      position: fixed;
      z-index: -1;
      color: rgba(255, 156, 174, 0.14);
      font-size: clamp(120px, 18vw, 260px);
      line-height: 1;
      pointer-events: none;
    }

    body::before {
      top: 5vh;
      left: 4vw;
      transform: rotate(-16deg);
    }

    body::after {
      right: 3vw;
      bottom: 2vh;
      color: rgba(244, 199, 161, 0.12);
      transform: rotate(18deg);
    }

    main {
      width: min(1080px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 460px) minmax(0, 1fr);
      gap: clamp(26px, 5vw, 64px);
      align-items: center;
      padding: clamp(14px, 2vw, 22px);
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 247, 243, 0.075), rgba(255, 247, 243, 0.025));
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .cover-column {
      display: grid;
      gap: 18px;
    }

    .cover-wrap {
      position: relative;
      isolation: isolate;
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: 8% -7% -8% 10%;
      z-index: -1;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.42), rgba(244, 199, 161, 0.28));
      filter: blur(50px);
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 8px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      object-fit: cover;
      box-shadow: var(--shadow);
    }

    .dedication {
      margin: 0;
      padding-left: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .album {
      min-width: 0;
      display: grid;
      gap: 24px;
      padding: clamp(0px, 2vw, 12px) 0;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .heart {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(232, 155, 134, 0.44);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--accent);
      background: rgba(255, 156, 174, 0.12);
      box-shadow: 0 0 28px rgba(255, 156, 174, 0.2);
      font-size: 14px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 7em;
      font-size: clamp(44px, 7.4vw, 84px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 18px 60px rgba(255, 156, 174, 0.16);
    }

    .summary {
      max-width: 520px;
      margin: -8px 0 4px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .tracks {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    button {
      width: 100%;
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 38px 1fr 40px;
      align-items: center;
      gap: 16px;
      font: inherit;
      text-align: left;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 247, 243, 0.088), rgba(255, 247, 243, 0.045));
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 156, 174, 0.62);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.13), rgba(255, 247, 243, 0.07));
      box-shadow: 0 18px 44px rgba(255, 156, 174, 0.12);
      outline: none;
    }

    button[aria-pressed="true"] {
      border-color: rgba(255, 156, 174, 0.76);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.18), rgba(244, 199, 161, 0.09));
    }

    .track-number {
      color: var(--dim);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .track-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .track-state {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.08);
      font-size: 13px;
      justify-self: end;
    }

    button[aria-pressed="true"] .track-state {
      border-color: transparent;
      color: #2a1016;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px rgba(255, 156, 174, 0.28);
    }

    .player {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.11), rgba(255, 247, 243, 0.04));
      box-shadow: inset 0 1px 0 rgba(255, 247, 243, 0.08);
    }

    audio {
      width: 100%;
      height: 42px;
      filter: saturate(0.86);
    }

    .now-playing {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
        align-items: start;
      }

      main {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .cover-column {
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        max-width: none;
        font-size: clamp(38px, 12vw, 62px);
      }

      button {
        min-height: 64px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cover-column">
      <div class="cover-wrap">
        <img class="cover" src="album-cover.png" alt="万梦琪的个人专辑封面">
      </div>
      <p class="dedication">把一小束光留给你</p>
    </div>

    <section class="album" aria-label="专辑播放器">
      <div class="meta-line">
        <span class="heart" aria-hidden="true">♡</span>
        <span>Personal Album</span>
      </div>

      <h1>万梦琪的个人专辑</h1>
      <p class="summary">听见她的声音</p>

      <ul class="tracks" aria-label="歌曲列表">
        <li>
          <button type="button" data-src="trust me.mp3" data-title="trust me" aria-pressed="false">
            <span class="track-number">01</span>
            <span class="track-title">trust me</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="怎样.mp3" data-title="怎样" aria-pressed="false">
            <span class="track-number">02</span>
            <span class="track-title">怎样</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="难过233秒.mp3" data-title="难过233秒" aria-pressed="false">
            <span class="track-number">03</span>
            <span class="track-title">难过233秒</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
         <li>
          <button type="button" data-src="恋爱困难少女.mp3" data-title="恋爱困难少女" aria-pressed="false">
            <span class="track-number">04</span>
            <span class="track-title">恋爱困难少女</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
      </ul>

      <div class="player">
        <audio controls preload="metadata"></audio>
        <p class="now-playing" aria-live="polite">点击一首歌开始播放</p>
      </div>
    </section>
  </main>

  <script>
    const audio = document.querySelector("audio");
    const statusText = document.querySelector(".now-playing");
    const trackButtons = Array.from(document.querySelectorAll("[data-src]"));

    function setActiveTrack(activeButton) {
      trackButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.setAttribute("aria-pressed", String(isActive));
        button.querySelector(".track-state").textContent = isActive ? "❚❚" : "▶";
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const shouldLoad = audio.getAttribute("src") !== button.dataset.src;

        if (shouldLoad) {
          audio.src = button.dataset.src;
          statusText.textContent = `正在播放：${button.dataset.title}`;
          setActiveTrack(button);
        }

        if (!audio.paused && !shouldLoad) {
          audio.pause();
          button.querySelector(".track-state").textContent = "▶";
          statusText.textContent = `已暂停：${button.dataset.title}`;
          return;
        }

        try {
          await audio.play();
          setActiveTrack(button);
          statusText.textContent = `正在播放：${button.dataset.title}`;
        } catch (error) {
          statusText.textContent = "浏览器阻止了播放，请再点一次播放按钮";
        }
      });
    });

    audio.addEventListener("ended", () => {
      const currentIndex = trackButtons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
      const nextButton = trackButtons[currentIndex + 1];

      if (nextButton) {
        nextButton.click();
      } else {
        setActiveTrack(null);
        statusText.textContent = "播放结束";
      }
    });
  </script>
</body>
</html>
