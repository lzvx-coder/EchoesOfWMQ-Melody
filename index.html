<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万梦琪的个人专辑</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #160f15;
      --ink: #fff7f3;
      --muted: #dbc1bf;
      --dim: #a88b8a;
      --line: rgba(255, 247, 243, 0.16);
      --panel: rgba(255, 247, 243, 0.07);
      --panel-strong: rgba(255, 247, 243, 0.12);
      --accent: #ff9cae;
      --accent-2: #f4c7a1;
      --shadow: 0 36px 110px rgba(0, 0, 0, 0.48);
    }

    body[data-theme="moon"] {
      --page: #101922;
      --ink: #f6fbff;
      --muted: #c0d2dc;
      --dim: #8ea5b2;
      --line: rgba(246, 251, 255, 0.16);
      --panel: rgba(246, 251, 255, 0.07);
      --panel-strong: rgba(246, 251, 255, 0.12);
      --accent: #7dd3fc;
      --accent-2: #d8b4fe;
      background:
        linear-gradient(135deg, rgba(125, 211, 252, 0.2), transparent 34%),
        linear-gradient(315deg, rgba(216, 180, 254, 0.16), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(246, 251, 255, 0.08), transparent 35%),
        var(--page);
    }

    body[data-theme="forest"] {
      --page: #121b16;
      --ink: #fbfff9;
      --muted: #c8dcc4;
      --dim: #94a98f;
      --line: rgba(251, 255, 249, 0.16);
      --panel: rgba(251, 255, 249, 0.07);
      --panel-strong: rgba(251, 255, 249, 0.12);
      --accent: #86efac;
      --accent-2: #fde68a;
      background:
        linear-gradient(135deg, rgba(134, 239, 172, 0.18), transparent 34%),
        linear-gradient(315deg, rgba(253, 230, 138, 0.16), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(251, 255, 249, 0.08), transparent 35%),
        var(--page);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.24), transparent 34%),
        linear-gradient(315deg, rgba(244, 199, 161, 0.18), transparent 36%),
        radial-gradient(circle at 50% 8%, rgba(255, 247, 243, 0.08), transparent 35%),
        var(--page);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "♡";
      position: fixed;
      z-index: -1;
      color: rgba(255, 156, 174, 0.14);
      font-size: clamp(120px, 18vw, 260px);
      line-height: 1;
      pointer-events: none;
    }

    body::before {
      top: 5vh;
      left: 4vw;
      transform: rotate(-16deg);
    }

    body::after {
      right: 3vw;
      bottom: 2vh;
      color: rgba(244, 199, 161, 0.12);
      transform: rotate(18deg);
    }

    main {
      width: min(1080px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 460px) minmax(0, 1fr);
      gap: clamp(26px, 5vw, 64px);
      align-items: center;
      padding: clamp(14px, 2vw, 22px);
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 247, 243, 0.075), rgba(255, 247, 243, 0.025));
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .cover-column {
      display: grid;
      gap: 18px;
    }

    .cover-wrap {
      position: relative;
      isolation: isolate;
      cursor: pointer;
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: 8% -7% -8% 10%;
      z-index: -1;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.42), rgba(244, 199, 161, 0.28));
      filter: blur(50px);
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 8px;
      border: 1px solid rgba(255, 247, 243, 0.22);
      object-fit: cover;
      box-shadow: var(--shadow);
      transform: rotate(0deg);
      transform-origin: center;
      transition: transform 220ms ease, filter 220ms ease, border-radius 380ms ease, box-shadow 380ms ease;
    }

    .cover-wrap:hover .cover,
    .cover-wrap:focus-within .cover {
      transform: translateY(-2px);
      filter: saturate(1.06) brightness(1.04);
    }

    .cover-wrap.is-secret .cover {
      animation: secret-cover 780ms ease both;
    }

    .record-lines {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle, transparent 0 17%, rgba(0, 0, 0, 0.2) 18% 100%),
        repeating-radial-gradient(circle, rgba(255, 247, 243, 0.2) 0 1px, transparent 1px 11px);
      mix-blend-mode: soft-light;
      transition: opacity 360ms ease;
      pointer-events: none;
    }

    .dedication {
      margin: 0;
      padding-left: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .album {
      min-width: 0;
      display: grid;
      gap: 24px;
      padding: clamp(0px, 2vw, 12px) 0;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .heart {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(232, 155, 134, 0.44);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--accent);
      background: rgba(255, 156, 174, 0.12);
      box-shadow: 0 0 28px rgba(255, 156, 174, 0.2);
      font-size: 14px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 7em;
      font-size: clamp(44px, 7.4vw, 84px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 18px 60px rgba(255, 156, 174, 0.16);
    }

    .summary {
      max-width: 520px;
      margin: -8px 0 4px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .tracks {
      display: grid;
      gap: 10px;
      margin: 0;
      max-height: calc((70px * 4) + (10px * 3));
      padding: 0 6px 0 0;
      list-style: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: rgba(255, 156, 174, 0.62) rgba(255, 247, 243, 0.08);
      scrollbar-width: thin;
    }

    .tracks::-webkit-scrollbar {
      width: 8px;
    }

    .tracks::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(255, 247, 243, 0.08);
    }

    .tracks::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    .tracks button {
      width: 100%;
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 38px 1fr 40px;
      align-items: center;
      gap: 16px;
      font: inherit;
      text-align: left;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 247, 243, 0.088), rgba(255, 247, 243, 0.045));
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .tracks button:hover,
    .tracks button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 156, 174, 0.62);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.13), rgba(255, 247, 243, 0.07));
      box-shadow: 0 18px 44px rgba(255, 156, 174, 0.12);
      outline: none;
    }

    .tracks button[aria-pressed="true"] {
      border-color: rgba(255, 156, 174, 0.76);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.18), rgba(244, 199, 161, 0.09));
    }

    .track-number {
      color: var(--dim);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .track-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .track-state {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.08);
      font-size: 13px;
      justify-self: end;
    }

    .tracks button[aria-pressed="true"] .track-state {
      border-color: transparent;
      color: #2a1016;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px rgba(255, 156, 174, 0.28);
    }

    .album-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button,
    .theme-select,
    .comment-form button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .action-button:hover,
    .action-button:focus-visible,
    .theme-select:hover,
    .theme-select:focus-visible,
    .comment-form button:hover,
    .comment-form button:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255, 156, 174, 0.58);
      background: var(--panel-strong);
      outline: none;
    }

    .action-button[aria-pressed="true"] {
      border-color: rgba(255, 156, 174, 0.76);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.2), rgba(244, 199, 161, 0.1));
    }

    .theme-select {
      width: 100%;
      appearance: none;
      text-align: center;
    }

    .player {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.11), rgba(255, 247, 243, 0.04));
      box-shadow: inset 0 1px 0 rgba(255, 247, 243, 0.08);
    }

    audio {
      width: 100%;
      height: 42px;
      filter: saturate(0.86);
    }

    .now-playing {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .track-note {
      min-height: 24px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.055);
      font-size: 14px;
      line-height: 1.6;
    }

    .comments {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 247, 243, 0.045);
    }

    .comments h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .comment-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .comment-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 247, 243, 0.06);
      outline: none;
    }

    .comment-input:focus {
      border-color: rgba(255, 156, 174, 0.62);
      background: rgba(255, 247, 243, 0.08);
    }

    .comment-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .comment-list li {
      padding: 10px 12px;
      border: 1px solid rgba(255, 247, 243, 0.1);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 247, 243, 0.045);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .cover-wrap.is-spinning .cover {
      border-radius: 50%;
      filter: saturate(1.08) brightness(1.04);
      box-shadow:
        var(--shadow),
        0 0 34px rgba(255, 156, 174, 0.28),
        0 0 78px rgba(244, 199, 161, 0.16);
    }

    .cover-wrap.is-spinning::after {
      inset: 45%;
      border-radius: 50%;
      background: rgba(22, 15, 21, 0.78);
      box-shadow:
        0 0 0 12px rgba(255, 247, 243, 0.1),
        0 0 0 26px rgba(0, 0, 0, 0.16);
    }

    .cover-wrap.is-spinning::before {
      animation: album-pulse 1800ms ease-in-out infinite;
    }

    .cover-wrap.is-spinning .record-lines,
    .cover-wrap.is-returning .record-lines {
      opacity: 0.58;
    }

    .cover-wrap.is-returning .cover {
      border-radius: 50%;
    }

    @keyframes album-pulse {
      0%,
      100% {
        opacity: 0.84;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.045);
      }
    }

    .secret-note {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 36px));
      transform: translateX(-50%);
      border: 1px solid rgba(255, 247, 243, 0.18);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255, 156, 174, 0.94), rgba(244, 199, 161, 0.9));
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.36);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      animation: secret-note 2600ms ease both;
      pointer-events: none;
    }

    .secret-heart {
      position: fixed;
      z-index: 19;
      width: 14px;
      height: 14px;
      color: var(--accent);
      font-size: 14px;
      line-height: 1;
      text-shadow: 0 0 18px rgba(255, 156, 174, 0.42);
      animation: secret-heart 1200ms ease-out forwards;
      pointer-events: none;
    }

    @keyframes secret-cover {
      0%,
      100% {
        transform: scale(1);
      }

      38% {
        transform: scale(1.035) rotate(-1.2deg);
      }

      68% {
        transform: scale(1.018) rotate(1deg);
      }
    }

    @keyframes secret-note {
      0% {
        opacity: 0;
        transform: translate(-50%, 18px);
      }

      14%,
      82% {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 14px);
      }
    }

    @keyframes secret-heart {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--secret-x)), calc(-50% - var(--secret-y))) scale(1.45) rotate(var(--secret-r));
      }
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
        align-items: start;
      }

      main {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .cover-column {
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        max-width: none;
        font-size: clamp(38px, 12vw, 62px);
      }

      .tracks button {
        min-height: 64px;
      }

      .tracks {
        max-height: calc((64px * 4) + (10px * 3));
      }

      .album-actions,
      .comment-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cover-column">
      <div class="cover-wrap" role="button" tabindex="0" aria-label="点击封面寻找小彩蛋">
        <img class="cover" src="album-cover.png" alt="万梦琪的个人专辑封面">
        <span class="record-lines" aria-hidden="true"></span>
      </div>
      <p class="dedication">把一小束光留给你</p>
    </div>

    <section class="album" aria-label="专辑播放器">
      <div class="meta-line">
        <span class="heart" aria-hidden="true">♡</span>
        <span>Personal Album</span>
      </div>

      <h1>万梦琪的个人专辑</h1>
      <p class="summary">听见她的声音</p>

      <ul class="tracks" aria-label="歌曲列表">
        <li>
          <button type="button" data-src="trust me.mp3" data-title="trust me" data-note="试试看我的爱" aria-pressed="false">
            <span class="track-number">01</span>
            <span class="track-title">trust me</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="怎样.mp3" data-title="怎样" data-note="我这里天黑了 我想你了" aria-pressed="false">
            <span class="track-number">02</span>
            <span class="track-title">怎样</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="难过233秒.mp3" data-title="难过233秒" data-note="歌曲232秒 最后一秒不要难过 要开心哦" aria-pressed="false">
            <span class="track-number">03</span>
            <span class="track-title">难过233秒</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
         <li>
          <button type="button" data-src="恋爱困难少女.mp3" data-title="恋爱困难少女" data-note="社恐才是恋爱困难少女" aria-pressed="false">
            <span class="track-number">04</span>
            <span class="track-title">恋爱困难少女</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="世界正中.mp3" data-title="世界正中" data-note="世界很大 但这一刻的正中间是你" aria-pressed="false">
            <span class="track-number">05</span>
            <span class="track-title">世界正中</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="这世界也是我的家.mp3" data-title="这世界也是我的家" data-note="你听不见我说话" aria-pressed="false">
            <span class="track-number">05</span>
            <span class="track-title">这世界也是我的家</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="巴拉莱卡.mp3" data-title="巴拉莱卡" data-note="我用尽了一生赞美 他教导有方" aria-pressed="false">
            <span class="track-number">05</span>
            <span class="track-title">巴拉莱卡</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="完美先生和差不多小姐.mp3" data-title="完美先生和差不多小姐" data-note="我奔向你 记得牵我的手" aria-pressed="false">
            <span class="track-number">05</span>
            <span class="track-title">完美先生和差不多小姐</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
      </ul>

      <div class="album-actions" aria-label="专辑操作">
        <button class="action-button" type="button" id="likeButton" aria-pressed="false">
          <span aria-hidden="true">♥</span>
          <span id="likeText">收藏专辑</span>
        </button>
        <button class="action-button" type="button" id="shuffleButton">
          <span aria-hidden="true">↝</span>
          <span>随机播放</span>
        </button>
        <select class="theme-select" id="themeSelect" aria-label="主题切换">
          <option value="rose">绯红</option>
          <option value="moon">静谧夜</option>
          <option value="forest">苍翠</option>
        </select>
      </div>
      
      <div class="player">
        <audio controls preload="metadata"></audio>
        <p class="now-playing" aria-live="polite">点击一首歌开始播放</p>
        <p class="track-note" aria-live="polite">选一首歌吧</p>
      </div>

      <section class="comments" aria-label="本地留言墙">
        <h2>留言墙</h2>
        <form class="comment-form">
          <input class="comment-input" type="text" maxlength="80" placeholder="说点什么吧">
          <button type="submit">就这样</button>
        </form>
        <ul class="comment-list" aria-live="polite"></ul>
      </section>
    </section>
  </main>

  <script>
    const audio = document.querySelector("audio");
    const statusText = document.querySelector(".now-playing");
    const coverWrap = document.querySelector(".cover-wrap");
    const coverImage = document.querySelector(".cover");
    const trackButtons = Array.from(document.querySelectorAll("[data-src]"));
    let coverTapCount = 0;
    let coverTapTimer;
    let vinylAnimation;
    let returnTimer;

    function setActiveTrack(activeButton) {
      trackButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.setAttribute("aria-pressed", String(isActive));
        button.querySelector(".track-state").textContent = isActive ? "❚❚" : "▶";
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const shouldLoad = audio.getAttribute("src") !== button.dataset.src;

        if (shouldLoad) {
          audio.src = button.dataset.src;
          statusText.textContent = `正在播放：${button.dataset.title}`;
          setActiveTrack(button);
        }

        if (!audio.paused && !shouldLoad) {
          audio.pause();
          button.querySelector(".track-state").textContent = "▶";
          statusText.textContent = `已暂停：${button.dataset.title}`;
          return;
        }

        try {
          await audio.play();
          setActiveTrack(button);
          statusText.textContent = `正在播放：${button.dataset.title}`;
        } catch (error) {
          statusText.textContent = "浏览器阻止了播放，请再点一次播放按钮";
        }
      });
    });

    audio.addEventListener("ended", () => {
      const currentIndex = trackButtons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
      const nextButton = trackButtons[currentIndex + 1];

      if (nextButton) {
        nextButton.click();
      } else {
        setActiveTrack(null);
        statusText.textContent = "播放结束";
      }
    });

    function showSecretNote() {
      const oldNote = document.querySelector(".secret-note");

      if (oldNote) {
        oldNote.remove();
      }

      const note = document.createElement("div");
      note.className = "secret-note";
      note.textContent = "这张专辑偷偷多放了一点喜欢。";
      document.body.append(note);
      setTimeout(() => note.remove(), 2600);
    }

    function burstSecretHearts() {
      const coverBox = coverWrap.getBoundingClientRect();
      const originX = coverBox.left + coverBox.width / 2;
      const originY = coverBox.top + coverBox.height / 2;

      for (let index = 0; index < 14; index += 1) {
        const heart = document.createElement("span");
        const angle = (Math.PI * 2 * index) / 14;
        const distance = 76 + Math.random() * 68;

        heart.className = "secret-heart";
        heart.textContent = "\u2665";
        heart.style.left = `${originX}px`;
        heart.style.top = `${originY}px`;
        heart.style.setProperty("--secret-x", `${Math.cos(angle) * distance}px`);
        heart.style.setProperty("--secret-y", `${Math.sin(angle) * distance + 80}px`);
        heart.style.setProperty("--secret-r", `${Math.random() * 80 - 40}deg`);
        document.body.append(heart);
        setTimeout(() => heart.remove(), 1200);
      }
    }

    function unlockCoverSecret() {
      coverWrap.classList.remove("is-secret");
      void coverWrap.offsetWidth;
      coverWrap.classList.add("is-secret");
      statusText.textContent = "这张专辑偷偷多放了一点喜欢。";
      showSecretNote();
      burstSecretHearts();
      setTimeout(() => coverWrap.classList.remove("is-secret"), 780);
    }

    function countCoverTap() {
      coverTapCount += 1;
      clearTimeout(coverTapTimer);
      coverTapTimer = setTimeout(() => {
        coverTapCount = 0;
      }, 1400);

      if (coverTapCount >= 3) {
        coverTapCount = 0;
        unlockCoverSecret();
      }
    }

    coverWrap.addEventListener("click", countCoverTap);
    coverWrap.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        countCoverTap();
      }
    });

    const noteText = document.querySelector(".track-note");
    const likeButton = document.querySelector("#likeButton");
    const likeText = document.querySelector("#likeText");
    const shuffleButton = document.querySelector("#shuffleButton");
    const themeSelect = document.querySelector("#themeSelect");
    const commentForm = document.querySelector(".comment-form");
    const commentInput = document.querySelector(".comment-input");
    const commentList = document.querySelector(".comment-list");
    const storageKeys = {
      liked: "wmq-album-liked",
      theme: "wmq-album-theme",
      comments: "wmq-album-comments"
    };

    function getActiveTrackIndex() {
      return trackButtons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
    }

    function updateTrackNote(button) {
      noteText.textContent = button.dataset.note || "选一首歌吧";
    }

    function getCurrentCoverRotation() {
      const transform = getComputedStyle(coverImage).transform;

      if (!transform || transform === "none") {
        return 0;
      }

      const values = transform.match(/matrix\(([^)]+)\)/);

      if (!values) {
        return 0;
      }

      const [a, b] = values[1].split(",").map(Number);
      const angle = Math.atan2(b, a) * (180 / Math.PI);
      return angle < 0 ? angle + 360 : angle;
    }

    function startCoverSpin() {
      if (vinylAnimation) {
        return;
      }

      const currentRotation = getCurrentCoverRotation();
      clearTimeout(returnTimer);
      coverWrap.classList.remove("is-returning");
      coverImage.style.transition = "";
      coverImage.style.transform = "";
      vinylAnimation = coverImage.animate([
        { transform: `rotate(${currentRotation}deg)` },
        { transform: `rotate(${currentRotation + 360}deg)` }
      ], {
        duration: 5600,
        easing: "linear",
        iterations: Infinity
      });
    }

    function returnCoverHome() {
      if (!vinylAnimation) {
        coverWrap.classList.remove("is-returning");
        coverImage.style.transform = "";
        return;
      }

      const currentRotation = getCurrentCoverRotation();
      const remainingRotation = currentRotation < 0.5 ? 0 : 360 - currentRotation;
      const returnDuration = remainingRotation === 0 ? 0 : Math.max(420, Math.round((remainingRotation / 360) * 1100));
      const targetRotation = remainingRotation === 0 ? 0 : 360;
      vinylAnimation.cancel();
      vinylAnimation = null;
      coverWrap.classList.add("is-returning");
      coverImage.style.transition = "none";
      coverImage.style.transform = `rotate(${currentRotation}deg)`;
      void coverImage.offsetWidth;
      coverImage.style.transition = returnDuration
        ? `transform ${returnDuration}ms cubic-bezier(0.22, 1, 0.36, 1), border-radius 380ms ease, box-shadow 380ms ease, filter 300ms ease`
        : "none";
      coverImage.style.transform = `rotate(${targetRotation}deg)`;

      returnTimer = setTimeout(() => {
        if (!vinylAnimation) {
          coverWrap.classList.remove("is-returning");
          coverImage.style.transition = "none";
          coverImage.style.transform = "";
          void coverImage.offsetWidth;
          coverImage.style.transition = "";
        }
      }, returnDuration + 40);
    }

    function updateCoverSpin() {
      const shouldSpin = Boolean(audio.getAttribute("src")) && !audio.paused && !audio.ended;
      coverWrap.classList.toggle("is-spinning", shouldSpin);

      if (shouldSpin) {
        startCoverSpin();
      } else {
        returnCoverHome();
      }
    }

    function updatePausedTrackIcon() {
      const activeIndex = getActiveTrackIndex();

      if (activeIndex >= 0 && audio.paused) {
        trackButtons[activeIndex].querySelector(".track-state").textContent = "▶";
      }
    }

    function updatePlayingTrackIcon() {
      const activeIndex = getActiveTrackIndex();

      if (activeIndex >= 0 && !audio.paused) {
        trackButtons[activeIndex].querySelector(".track-state").textContent = "❚❚";
      }
    }

    function setLiked(isLiked) {
      localStorage.setItem(storageKeys.liked, String(isLiked));
      likeButton.setAttribute("aria-pressed", String(isLiked));
      likeText.textContent = isLiked ? "已收藏" : "收藏专辑";
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      themeSelect.value = theme;
      localStorage.setItem(storageKeys.theme, theme);
    }

    function readComments() {
      try {
        return JSON.parse(localStorage.getItem(storageKeys.comments)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveComments(comments) {
      localStorage.setItem(storageKeys.comments, JSON.stringify(comments));
    }

    function renderComments() {
      const comments = readComments();
      commentList.innerHTML = "";

      if (comments.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.textContent = "这里还没有留言哦";
        commentList.append(emptyItem);
        return;
      }

      comments.forEach((comment) => {
        const item = document.createElement("li");
        item.textContent = comment;
        commentList.append(item);
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", () => {
        updateTrackNote(button);
        setTimeout(updateCoverSpin, 0);
      });
    });

    audio.addEventListener("play", () => {
      updateCoverSpin();
      updatePlayingTrackIcon();
    });
    audio.addEventListener("pause", () => {
      updateCoverSpin();
      updatePausedTrackIcon();
    });
    audio.addEventListener("ended", updateCoverSpin);

    likeButton.addEventListener("click", () => {
      const nextLiked = likeButton.getAttribute("aria-pressed") !== "true";
      setLiked(nextLiked);
      statusText.textContent = nextLiked ? "已收藏这张专辑。" : "已取消收藏。";
    });

    shuffleButton.addEventListener("click", () => {
      const currentIndex = getActiveTrackIndex();
      let nextIndex = Math.floor(Math.random() * trackButtons.length);

      if (trackButtons.length > 1) {
        while (nextIndex === currentIndex) {
          nextIndex = Math.floor(Math.random() * trackButtons.length);
        }
      }

      trackButtons[nextIndex].click();
    });

    themeSelect.addEventListener("change", () => {
      setTheme(themeSelect.value);
    });

    commentForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = commentInput.value.trim();

      if (!value) {
        return;
      }

      const comments = readComments();
      comments.unshift(value);
      saveComments(comments.slice(0, 12));
      commentInput.value = "";
      renderComments();
    });

    setLiked(localStorage.getItem(storageKeys.liked) === "true");
    setTheme(localStorage.getItem(storageKeys.theme) || "rose");
    renderComments();
  </script>
</body>
</html>
