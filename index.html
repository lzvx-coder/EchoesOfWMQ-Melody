<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XXX 的个人专辑</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #111718;
      --ink: #f6f1e8;
      --muted: #aeb7b4;
      --soft: #1a2223;
      --line: rgba(246, 241, 232, 0.12);
      --accent: #2db3a4;
      --accent-2: #e77e5f;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(45, 179, 164, 0.13), transparent 34%),
        linear-gradient(300deg, rgba(231, 126, 95, 0.12), transparent 28%),
        var(--page);
    }

    main {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(260px, 410px) 1fr;
      gap: clamp(24px, 5vw, 54px);
      align-items: center;
    }

    .cover-wrap {
      position: relative;
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 7% -5% -7% 14%;
      z-index: -1;
      border-radius: 8px;
      background: rgba(45, 179, 164, 0.22);
      filter: blur(42px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 8px;
      border: 1px solid var(--line);
      object-fit: cover;
      box-shadow: var(--shadow);
    }

    .album {
      min-width: 0;
      display: grid;
      gap: 26px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
    }

    .summary {
      margin: -10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .tracks {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    button {
      width: 100%;
      min-height: 68px;
      border: 1px solid transparent;
      border-bottom-color: var(--line);
      border-radius: 8px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 36px 1fr 40px;
      align-items: center;
      gap: 16px;
      font: inherit;
      text-align: left;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateX(4px);
      border-color: rgba(45, 179, 164, 0.45);
      background: rgba(246, 241, 232, 0.055);
      outline: none;
    }

    button[aria-pressed="true"] {
      border-color: rgba(45, 179, 164, 0.5);
      background: rgba(45, 179, 164, 0.1);
    }

    .track-number {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .track-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .track-state {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(246, 241, 232, 0.07);
      font-size: 13px;
      justify-self: end;
    }

    button[aria-pressed="true"] .track-state {
      border-color: transparent;
      color: #081312;
      background: var(--accent);
    }

    .player {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(246, 241, 232, 0.05);
    }

    audio {
      width: 100%;
      height: 42px;
      filter: saturate(0.85);
    }

    .now-playing {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 780px) {
      body {
        padding: 18px;
        align-items: start;
      }

      main {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .cover-wrap {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
      }

      h1 {
        font-size: clamp(38px, 13vw, 60px);
      }

      button {
        min-height: 64px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cover-wrap">
      <img class="cover" src="album-cover.png" alt="XXX 的个人专辑封面">
    </div>

    <section class="album" aria-label="专辑播放器">
      <p class="eyebrow">Personal Album</p>
      <h1>XXX 的个人专辑</h1>
      <p class="summary">三首歌，按顺序播放。点击歌名即可开始。</p>

      <ul class="tracks" aria-label="歌曲列表">
        <li>
          <button type="button" data-src="trust me.mp3" data-title="trust me" aria-pressed="false">
            <span class="track-number">01</span>
            <span class="track-title">trust me</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="怎样.mp3" data-title="怎样" aria-pressed="false">
            <span class="track-number">02</span>
            <span class="track-title">怎样</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
        <li>
          <button type="button" data-src="难过233秒.mp3" data-title="难过233秒" aria-pressed="false">
            <span class="track-number">03</span>
            <span class="track-title">难过233秒</span>
            <span class="track-state" aria-hidden="true">▶</span>
          </button>
        </li>
      </ul>

      <div class="player">
        <audio controls preload="metadata"></audio>
        <p class="now-playing" aria-live="polite">点击一首歌开始播放</p>
      </div>
    </section>
  </main>

  <script>
    const audio = document.querySelector("audio");
    const statusText = document.querySelector(".now-playing");
    const trackButtons = Array.from(document.querySelectorAll("[data-src]"));

    function setActiveTrack(activeButton) {
      trackButtons.forEach((button) => {
        const isActive = button === activeButton;
        button.setAttribute("aria-pressed", String(isActive));
        button.querySelector(".track-state").textContent = isActive ? "❚❚" : "▶";
      });
    }

    trackButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const shouldLoad = audio.getAttribute("src") !== button.dataset.src;

        if (shouldLoad) {
          audio.src = button.dataset.src;
          statusText.textContent = `正在播放：${button.dataset.title}`;
          setActiveTrack(button);
        }

        if (!audio.paused && !shouldLoad) {
          audio.pause();
          button.querySelector(".track-state").textContent = "▶";
          statusText.textContent = `已暂停：${button.dataset.title}`;
          return;
        }

        try {
          await audio.play();
          setActiveTrack(button);
          statusText.textContent = `正在播放：${button.dataset.title}`;
        } catch (error) {
          statusText.textContent = "浏览器阻止了播放，请再点一次播放按钮";
        }
      });
    });

    audio.addEventListener("ended", () => {
      const currentIndex = trackButtons.findIndex((button) => button.getAttribute("aria-pressed") === "true");
      const nextButton = trackButtons[currentIndex + 1];

      if (nextButton) {
        nextButton.click();
      } else {
        setActiveTrack(null);
        statusText.textContent = "播放结束";
      }
    });
  </script>
</body>
</html>
